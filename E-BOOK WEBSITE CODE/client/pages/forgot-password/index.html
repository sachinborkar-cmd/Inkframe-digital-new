<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Reset password | Inkframe Press</title><link rel="stylesheet" href="/assets/css/theme.css"><script src="/assets/js/tailwind-browser-4.1.13.js"></script></head><body><header class="site-header"></header><main class="wrap py-14"><section class="card p-7 max-w-xl mx-auto flow-card"><a class="flow-close" href="/" aria-label="Close password reset and return to the store" title="Back to store"><span aria-hidden="true">&#215;</span></a><h1 class="text-3xl font-bold">Set or reset your password</h1><p class="muted mt-4">Already use email OTP or Google? You can add a password here after verifying your email.</p><p id="password-message" role="status" class="mt-4"></p>
<form id="reset-request" class="mt-6 space-y-4"><label class="block">Registered email<input class="field mt-2" name="email" type="email" autocomplete="email" required maxlength="254"></label><button class="btn btn-primary" type="submit">Send reset code</button></form>
<form id="reset-verify" class="mt-6 space-y-4" hidden><label class="block">Six-digit reset code<input class="field mt-2" name="otp" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required></label><button class="btn btn-primary" type="submit">Verify code</button><button class="btn btn-ghost" type="button" id="reset-resend">Resend / change email</button></form>
<form id="reset-finish" class="mt-6 space-y-4" hidden><p class="muted">Use at least 12 characters (maximum 72 UTF-8 bytes). All existing sessions will be signed out.</p><label class="block">New password<input class="field mt-2" name="password" type="password" autocomplete="new-password" minlength="12" maxlength="72" required></label><label class="block">Confirm password<input class="field mt-2" name="confirmation" type="password" autocomplete="new-password" minlength="12" maxlength="72" required></label><button class="btn btn-primary" type="submit">Save new password</button></form><a class="nav-link inline-block mt-6" href="/signin/">Back to sign in</a></section></main><script src="/assets/js/password.js"></script><script src="/assets/js/site.js"></script></body></html>
